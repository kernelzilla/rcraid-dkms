# DKMS configuration for the rcraid RPM package.
# The placeholder below is substituted by rpmbuild with the rpm
# version-release so that every RPM release registers as a distinct DKMS
# module version and forces a rebuild on package upgrades.
PACKAGE_NAME="rcraid"
PACKAGE_VERSION="@DKMS_VERSION@"

BUILT_MODULE_NAME[0]="rcraid"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_NAME[0]="rcraid"
DEST_MODULE_LOCATION[0]="/extra"

# Reuse the kernel-module Makefile in this directory. The "dkms" make target
# builds rcraid.ko only - signing is left to DKMS' own MOK machinery.
# No CLEAN= line: it is deprecated in DKMS 3.x, which cleans automatically.
MAKE[0]="make KVERS=$kernelver dkms"

AUTOINSTALL="yes"
