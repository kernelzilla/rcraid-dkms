name: rcraid-dkms-ci
on:
  - push
  - pull_request
defaults:
  run:
    shell: bash
jobs:
  rcraid-dkms-ci-job:
    env:
      TERM: 'xterm-256color'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    name: ${{ github.event.repository.name }}_${{ matrix.os }}
    steps:
      - name: ${{ github.event.repository.name }}_${{ matrix.os }}_checkout
        uses: actions/checkout@v2

      - name: ${{ github.event.repository.name }}_${{ matrix.os }}_environment_details
        run: |
          uname -r
          uname -a
          cat /etc/os-release
          ls -1 /lib/modules/

      - name: ${{ github.event.repository.name }}_${{ matrix.os }}_install_build_depdencies
        run: |
          sudo apt install -y --no-install-recommends make linux-headers-generic

      - name: ${{ github.event.repository.name }}_${{ matrix.os }}_make
        run: |
          cd src
          echo
          ls -1 /lib/modules/
          echo
          export KVERS="$(ls -1 /lib/modules/ | tail -n1)"
          make dkms

  # Build the RPM and compile the module through DKMS inside containers
  # of each target distro (EL8, EL9, openSUSE Leap 15.6). A container has
  # no "running kernel", so the module is built against the installed
  # kernel-devel via `dkms build -k`; modprobe coverage lives in the
  # Vagrant matrix (see vagrant/test-all.sh).
  rcraid-dkms-rpm-ci-job:
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8
          - almalinux:9
          - opensuse/leap:15.6
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    name: ${{ github.event.repository.name }}_rpm_${{ matrix.image }}
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: rpm_build_and_dkms_compile
        run: bash ./vagrant/ci-container-test.sh
