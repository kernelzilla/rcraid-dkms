name: rcraid-dkms-release

# Vagrant/libvirt builds+tests the DKMS module on EL8, EL9 and openSUSE
# Leap 15 on every push/PR. When a tag is pushed, the RPMs produced inside
# those VMs — plus a .deb and an Arch package built in containers — are
# attached to a GitHub release.
on:
  push:
    branches: [main, compatibility_updates]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
  # Weekly: the vanilla-kernel VMs resolve the current stable+longterm
  # series from kernel.org at provision time, so this schedule doubles
  # as a new-kernel-release regression check.
  schedule: [{ cron: "23 5 * * 1" }]

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # Full VM pipeline per distro: rpmbuild + rpm install + dkms build/
  # install + verify.sh; artifacts are pulled before the modprobe smoke
  # test, since it can kill the virtio NIC (and on EL the rpm's dracut
  # hook bakes rcraid into the initramfs, so it may stay dead across a
  # reload). CI domains are destroyed at job end to free the runner.
  # -------------------------------------------------------------------
  vagrant-matrix:
    name: vagrant-${{ matrix.distro }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [el8, el9, opensuse15, ubuntu-xanmod,
                 debian-vanilla, ubuntu2404-vanilla, ubuntu2204-vanilla]
    env:
      VAGRANT_LIBVIRT_NETWORK: vagrantnet
      # Keep CI-created domains distinct from manually managed VMs on the
      # same host (both worktrees share the 'rcraid-dkms' basename).
      VAGRANT_DOMAIN_PREFIX: rcraid-ci_
    steps:
      - uses: actions/checkout@v4

      - name: Install libvirt, KVM and Vagrant
        run: |
          # Self-hosted runner: only install what is missing. Requires
          # passwordless sudo (or pre-installed deps) on the runner host.
          if command -v vagrant >/dev/null && command -v virsh >/dev/null; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system \
            libvirt-clients libvirt-dev libxslt-dev libxml2-dev \
            zlib1g-dev ruby-dev rsync curl
          curl -fsSL -o /tmp/vagrant.deb \
            https://releases.hashicorp.com/vagrant/2.4.9/vagrant_2.4.9-1_amd64.deb
          sudo dpkg -i /tmp/vagrant.deb || sudo apt-get -f install -y
          sudo usermod -aG libvirt,kvm $USER

      - name: Ensure KVM and the vagrantnet libvirt network
        run: |
          sudo modprobe kvm-intel 2>/dev/null || sudo modprobe kvm-amd 2>/dev/null || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          sudo systemctl start libvirtd 2>/dev/null || true
          # vagrantnet is a DHCP-only network (DNS disabled) so it does
          # not collide with a resolver bound to host port 53.
          virsh -c qemu:///system net-info vagrantnet >/dev/null 2>&1 || {
            virsh -c qemu:///system net-define vagrant/vagrantnet.xml
            virsh -c qemu:///system net-start vagrantnet
            virsh -c qemu:///system net-autostart vagrantnet
          }

      - name: Install vagrant plugins
        run: |
          vagrant plugin list | grep -q vagrant-libvirt || vagrant plugin install vagrant-libvirt
          vagrant plugin list | grep -q vagrant-reload  || vagrant plugin install vagrant-reload

      - name: Destroy any stale CI VM
        run: |
          sg libvirt -c "vagrant destroy -f rcraid-${{ matrix.distro }}" || true
          dom="rcraid-ci_rcraid-${{ matrix.distro }}"
          if virsh -c qemu:///system list --all --name | grep -qx "$dom"; then
            virsh -c qemu:///system destroy "$dom" || true
            virsh -c qemu:///system undefine --nvram "$dom" 2>/dev/null \
              || virsh -c qemu:///system undefine "$dom" || true
          fi
          # orphaned qcow2 volume from a partially-created/undefined domain
          virsh -c qemu:///system vol-delete --pool default "$dom.img" 2>/dev/null || true

      - name: Build and test in rcraid-${{ matrix.distro }}
        run: sg libvirt -c "vagrant up rcraid-${{ matrix.distro }} --provider=libvirt" || true

      # Artifacts are pulled BEFORE the destructive load test: the
      # driver's PCI probing can kill the virtio NIC, leaving the guest
      # unreachable over ssh afterwards. On EL guests rcraid is also
      # baked into the initramfs by the rpm's dracut hook, so a reload
      # may bring the module (and the dead NIC) right back.
      - name: Pull build artifacts
        run: sg libvirt -c "bash vagrant/pull-artifacts.sh rcraid-${{ matrix.distro }}"

      - name: Verify a package was produced
        run: |
          find "dist/${{ matrix.distro }}" \
            \( -name 'rcraid-dkms-*.x86_64.rpm' -o -name 'rcraid-dkms_*.deb' \) \
            -print -quit | grep -q .

      - name: Run modprobe smoke test (destructive, may kill the NIC)
        run: |
          sg libvirt -c "timeout 240 vagrant ssh rcraid-${{ matrix.distro }} \
            -c 'sudo bash /home/vagrant/rcraid-dkms/vagrant/load-test.sh'" \
            || echo "::warning::load test unreachable or timed out - NIC teardown is expected"

      # A reload brings the virtio NIC back so the smoke result code and
      # a console screenshot can be collected. Tolerated if the guest
      # never returns: the release job consumes smoke.rc/console.png
      # only as optional evidence.
      - name: Reload VM to restore networking
        run: sg libvirt -c "vagrant reload rcraid-${{ matrix.distro }} --no-provision" || true

      - name: Pull smoke-test evidence
        run: sg libvirt -c "bash vagrant/pull-artifacts.sh rcraid-${{ matrix.distro }}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.distro }}
          path: dist/${{ matrix.distro }}/

      # Don't leave CI domains running on the shared runner: each holds
      # 4G/4vcpu and starves later matrix jobs. Same virsh teardown as
      # the pre-build cleanup, run unconditionally.
      - name: Destroy CI VM
        if: always()
        run: |
          sg libvirt -c "vagrant destroy -f rcraid-${{ matrix.distro }}" || true
          dom="rcraid-ci_rcraid-${{ matrix.distro }}"
          virsh -c qemu:///system destroy "$dom" || true
          virsh -c qemu:///system undefine --nvram "$dom" 2>/dev/null \
            || virsh -c qemu:///system undefine "$dom" || true
          virsh -c qemu:///system vol-delete --pool default "$dom.img" 2>/dev/null || true

  # -------------------------------------------------------------------
  # .deb for Debian/Ubuntu
  # -------------------------------------------------------------------
  deb:
    name: pkg-debian
    runs-on: [self-hosted, linux, x64]
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build rcraid-dkms .deb
        run: |
          apt-get update
          apt-get install -y build-essential debhelper dkms devscripts
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/deb
          cp ../*.deb dist/deb/
      - uses: actions/upload-artifact@v4
        with:
          name: packages-deb
          path: dist/deb/
      # Container steps run as root; hand ownership of the shared runner
      # workdir back so later jobs can clean/checkout.
      - name: Restore workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/.." || echo 1000:1000)" "$GITHUB_WORKSPACE" || true

  # -------------------------------------------------------------------
  # Arch package
  # -------------------------------------------------------------------
  arch:
    name: pkg-arch
    runs-on: [self-hosted, linux, x64]
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch package
        run: |
          # makepkg's build() compiles the module for KVERS (default:
          # uname -r, which inside a container is the *host* kernel).
          # Point it at the kernel provided by Arch's linux-headers.
          pacman -Sy --noconfirm --needed sudo linux-headers
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chown -R builder:builder .
          cd arch
          KVERS="$(ls /usr/lib/modules | sort -V | tail -1)" \
            runuser -u builder -- makepkg -s --noconfirm
          mkdir -p ../dist/arch
          cp *.pkg.tar.zst ../dist/arch/
      - uses: actions/upload-artifact@v4
        with:
          name: packages-arch
          path: dist/arch/
      # Container steps run as root; hand ownership of the shared runner
      # workdir back so later jobs can clean/checkout.
      - name: Restore workspace ownership
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/.." || echo 1000:1000)" "$GITHUB_WORKSPACE" || true

  # -------------------------------------------------------------------
  # Tag-only: collect every package, generate a changelog since the
  # previous tag, checksums, and create a GitHub release.
  # -------------------------------------------------------------------
  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [vagrant-matrix, deb, arch]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-files

      - name: Checksums
        run: |
          cd release-files
          find . -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.tar.gz' \) \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)
          {
            echo "DKMS packages for the AMD RAIDXpert (rcraid) driver."
            echo
            echo "- RPMs built and DKMS-tested on AlmaLinux 8, AlmaLinux 9 and openSUSE Leap 15 via the Vagrant pipeline"
            echo "- .deb for Debian/Ubuntu"
            echo "- Arch package (.pkg.tar.zst)"
            echo "- Verify integrity with SHA256SUMS.txt"
            echo
            echo "## Changes${PREV_TAG:+ since $PREV_TAG}"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %s (%h)' "$PREV_TAG"..HEAD
            else
              git log --pretty=format:'- %s (%h)' HEAD
            fi
          } > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          name: rcraid-dkms ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release-files/**/*.rpm
            release-files/**/*.deb
            release-files/**/*.pkg.tar.zst
            release-files/**/*.tar.gz
            release-files/**/SHA256SUMS.txt
            release-files/**/smoke.rc
            release-files/**/console.png
